<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Study App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #176b5b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #176b5b;
      color: white;
      font-size: 16px;
    }

    .option {
      background: #eee;
      color: #222;
    }

    #quiz,
    #result {
      display: none;
    }

    #score {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>💊 Pharmacy Study App</h1>
  <p>Learn • Practice • Revise</p>
</header>

<div class="container">

  <div id="home">

    <div class="card">
      <h2>📚 Study Notes</h2>
      <p>Read your pharmacy notes.</p>
    </div>

    <div class="card">
      <h2>📝 MCQs</h2>
      <p>Test your pharmacy knowledge.</p>
      <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div class="card">
      <h2>🎴 Flashcards</h2>
      <p>Revise important concepts.</p>
    </div>

    <div class="card">
      <h2>📊 My Scores</h2>
      <p>Track your performance.</p>
    </div>

  </div>

  <div id="quiz" class="card">

    <h2>📝 Pharmacy MCQ</h2>

    <p id="questionNumber"></p>

    <h3 id="question"></h3>

    <div id="options"></div>

  </div>

  <div id="result" class="card">

    <h2>🎉 Quiz Complete!</h2>

    <p id="score"></p>

    <p id="message"></p>

    <button onclick="restartQuiz()">🔄 Try Again</button>

    <button onclick="goHome()">← Back to Home</button>

  </div>

</div>

<script>

const questions = [

  {
    question: "Which route of drug administration generally gives 100% bioavailability?",
    options: [
      "Oral",
      "Intravenous",
      "Subcutaneous",
      "Rectal"
    ],
    answer: 1
  },

  {
    question: "What is the study of drugs and their effects on living organisms?",
    options: [
      "Pharmacology",
      "Anatomy",
      "Histology",
      "Botany"
    ],
    answer: 0
  },

  {
    question: "Which organ is primarily responsible for most drug metabolism?",
    options: [
      "Heart",
      "Liver",
      "Lung",
      "Spleen"
    ],
    answer: 1
  },

  {
    question: "What does MCQ stand for?",
    options: [
      "Multiple Choice Question",
      "Medical Clinical Quiz",
      "Multiple Clinical Question",
      "Medical Choice Quiz"
    ],
    answer: 0
  },

  {
    question: "Which dosage form is designed to be swallowed?",
    options: [
      "Tablet",
      "Eye drop",
      "Ointment",
      "Injection"
    ],
    answer: 0
  }

];

let currentQuestion = 0;
let score = 0;

function startQuiz() {

  currentQuestion = 0;
  score = 0;

  document.getElementById("home").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  showQuestion();
}

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Question " + (currentQuestion + 1) + " of " + questions.length;

  document.getElementById("question").textContent = q.question;

  const optionsContainer = document.getElementById("options");

  optionsContainer.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.textContent = option;

    button.className = "option";

    button.onclick = function() {
      checkAnswer(index);
    };

    optionsContainer.appendChild(button);

  });
}

function checkAnswer(selected) {

  if (selected === questions[currentQuestion].answer) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("score").textContent =
    score + " / " + questions.length;

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("message").textContent =
    "Your score: " + percentage + "%";
}

function restartQuiz() {
  startQuiz();
}

function goHome() {

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
