<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Study App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #176b5b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #176b5b;
      color: white;
      font-size: 16px;
    }

    .option {
      background: #eee;
      color: #222;
    }

    .subject {
      background: #f1f7f5;
      color: #176b5b;
      text-align: left;
      font-weight: bold;
    }

    #quiz,
    #result,
    #notes {
      display: none;
    }

    #score {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    .note-content {
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>💊 Pharmacy Study App</h1>
  <p>Learn • Practice • Revise</p>
</header>

<div class="container">

  <!-- HOME -->

  <div id="home">

    <div class="card">
      <h2>📚 Study Notes</h2>
      <p>Read organized pharmacy notes.</p>
      <button onclick="openNotes()">Open Notes</button>
    </div>

    <div class="card">
      <h2>📝 MCQs</h2>
      <p>Test your pharmacy knowledge.</p>
      <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div class="card">
      <h2>🎴 Flashcards</h2>
      <p>Revise important concepts.</p>
      <button>Open Flashcards</button>
    </div>

    <div class="card">
      <h2>📊 My Scores</h2>
      <p>Track your performance.</p>
    </div>

  </div>


  <!-- NOTES -->

  <div id="notes">

    <div class="card">

      <h2>📚 Pharmacy Subjects</h2>

      <p>Select a subject to study.</p>

      <button class="subject" onclick="showNote('pharmacology')">
        💊 Pharmacology
      </button>

      <button class="subject" onclick="showNote('pharmacognosy')">
        🌿 Pharmacognosy
      </button>

      <button class="subject" onclick="showNote('pharmaceutics')">
        💉 Pharmaceutics
      </button>

      <button class="subject" onclick="showNote('medicinal')">
        🧪 Medicinal Chemistry
      </button>

      <button class="subject" onclick="showNote('pathology')">
        🔬 Pathology
      </button>

    </div>

    <div id="noteDisplay" class="card note-content">
    </div>

    <button onclick="goHome()">← Back to Home</button>

  </div>


  <!-- QUIZ -->

  <div id="quiz" class="card">

    <h2>📝 Pharmacy MCQ</h2>

    <p id="questionNumber"></p>

    <h3 id="question"></h3>

    <div id="options"></div>

  </div>


  <!-- RESULT -->

  <div id="result" class="card">

    <h2>🎉 Quiz Complete!</h2>

    <p id="score"></p>

    <p id="message"></p>

    <button onclick="restartQuiz()">🔄 Try Again</button>

    <button onclick="goHome()">← Back to Home</button>

  </div>

</div>


<script>

const questions = [

  {
    question: "Which route of drug administration generally gives 100% bioavailability?",
    options: ["Oral", "Intravenous", "Subcutaneous", "Rectal"],
    answer: 1
  },

  {
    question: "What is the study of drugs and their effects on living organisms?",
    options: ["Pharmacology", "Anatomy", "Histology", "Botany"],
    answer: 0
  },

  {
    question: "Which organ is primarily responsible for most drug metabolism?",
    options: ["Heart", "Liver", "Lung", "Spleen"],
    answer: 1
  },

  {
    question: "What does MCQ stand for?",
    options: [
      "Multiple Choice Question",
      "Medical Clinical Quiz",
      "Multiple Clinical Question",
      "Medical Choice Quiz"
    ],
    answer: 0
  },

  {
    question: "Which dosage form is designed to be swallowed?",
    options: ["Tablet", "Eye drop", "Ointment", "Injection"],
    answer: 0
  }

];


let currentQuestion = 0;
let score = 0;


function startQuiz() {

  currentQuestion = 0;
  score = 0;

  document.getElementById("home").style.display = "none";
  document.getElementById("notes").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  showQuestion();
}


function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Question " + (currentQuestion + 1) + " of " + questions.length;

  document.getElementById("question").textContent = q.question;

  const optionsContainer = document.getElementById("options");

  optionsContainer.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.textContent = option;

    button.className = "option";

    button.onclick = function() {
      checkAnswer(index);
    };

    optionsContainer.appendChild(button);

  });

}


function checkAnswer(selected) {

  if (selected === questions[currentQuestion].answer) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }

}


function showResult() {

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("score").textContent =
    score + " / " + questions.length;

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("message").textContent =
    "Your score: " + percentage + "%";

}


function restartQuiz() {
  startQuiz();
}


function openNotes() {

  document.getElementById("home").style.display = "none";
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("notes").style.display = "block";

}


function showNote(subject) {

  const display = document.getElementById("noteDisplay");

  if (subject === "pharmacology") {

    display.innerHTML = `
      <h2>💊 Pharmacology</h2>
      <h3>Definition</h3>
      <p>Pharmacology is the study of drugs, including their actions, effects and interactions with living organisms.</p>

      <h3>Major areas</h3>
      <ul>
        <li>Pharmacodynamics</li>
        <li>Pharmacokinetics</li>
        <li>Drug interactions</li>
        <li>Adverse drug effects</li>
      </ul>
    `;

  }

  else if (subject === "pharmacognosy") {

    display.innerHTML = `
      <h2>🌿 Pharmacognosy</h2>
      <h3>Definition</h3>
      <p>Pharmacognosy is the study of medicinal substances obtained from natural sources.</p>

      <h3>Sources</h3>
      <ul>
        <li>Plants</li>
        <li>Animals</li>
        <li>Microorganisms</li>
        <li>Marine sources</li>
      </ul>
    `;

  }

  else if (subject === "pharmaceutics") {

    display.innerHTML = `
      <h2>💉 Pharmaceutics</h2>
      <h3>Definition</h3>
      <p>Pharmaceutics deals with the formulation and preparation of medicines into suitable dosage forms.</p>

      <h3>Examples</h3>
      <ul>
        <li>Tablets</li>
        <li>Capsules</li>
        <li>Solutions</li>
        <li>Suspensions</li>
      </ul>
    `;

  }

  else if (subject === "medicinal") {

    display.innerHTML = `
      <h2>🧪 Medicinal Chemistry</h2>
      <h3>Definition</h3>
      <p>Medicinal chemistry involves the design, synthesis and study of chemical substances used as medicines.</p>

      <h3>Important areas</h3>
      <ul>
        <li>Drug structure</li>
        <li>Drug synthesis</li>
        <li>Structure–activity relationships</li>
        <li>Drug optimization</li>
      </ul>
    `;

  }

  else if (subject === "pathology") {

    display.innerHTML = `
      <h2>🔬 Pathology</h2>
      <h3>Definition</h3>
      <p>Pathology is the study of disease processes and the structural and functional changes they produce.</p>

      <h3>Major areas</h3>
      <ul>
        <li>Cell injury</li>
        <li>Inflammation</li>
        <li>Immunology</li>
        <li>Neoplasia</li>
      </ul>
    `;

  }

}


function goHome() {

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "none";
  document.getElementById("notes").style.display = "none";
  document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
